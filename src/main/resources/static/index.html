<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 선택</title>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f7f6; /* 기존 화면들과 통일된 배경색 */
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 전체 높이 사용 */
        }

        .main-title {
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 24px;
            text-align: center;
        }

        .card-container {
            display: flex;
            gap: 30px; /* 박스 사이 간격 */
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 큰 사각형 버튼 스타일 */
        .service-card {
            background-color: white;
            width: 280px;
            height: 280px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none; /* 링크 밑줄 제거 */
            color: #333;
            transition: all 0.3s ease; /* 부드러운 애니메이션 효과 */
            border: 2px solid transparent;
        }

        /* 마우스 올렸을 때의 효과 */
        .service-card:hover {
            transform: translateY(-10px); /* 위로 살짝 떠오름 */
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); /* 그림자 진해짐 */
            border-color: #3498db; /* 테두리 파란색 포인트 */
        }

        .icon {
            font-size: 60px; /* 아이콘 크기 */
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            padding: 0 20px;
            word-break: keep-all;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 650px) {
            .service-card {
                width: 100%;
                max-width: 320px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

<h1 class="main-title">원하시는 서비스를 선택해주세요</h1>

<div class="card-container">
    <a href="/prayer-board" class="service-card">
        <div class="icon">🙏</div>
        <div class="title">중보기도</div>
        <div class="desc">함께 마음을 모아 기도 제목을 나눕니다.</div>
    </a>

    <a href="/CDRS.html" class="service-card">
        <div class="icon">🧾</div>
        <div class="title">기부금 영수증</div>
        <div class="desc">본인 인증 후 기부금 영수증을 발급합니다.</div>
    </a>
</div>

</body>
</html>
