<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전자기부금영수증 발급 신청</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h2>전자기부금영수증 발급 신청</h2>
        <div class="input-group">
            <label for="receiptYear">조회 연도 선택</label>
            <select id="receiptYear" style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; background-color: white;">
                <option value="2026" selected>2026년</option>
                <option value="2025">2025년</option>
                <option value="2024">2024년</option>
            </select>
        </div>
        <div class="auth-box">
            <h3>등록교인 인증</h3>
            <table class="auth-table">
                <tr>
                    <th>성명</th>
                    <td>
                        <input type="text" id="name" placeholder="예) 홍길동">
                        <small>(직분자는 알파벳을 제외)</small>
                    </td>
                </tr>
                <tr>
                    <th>생년월일</th>
                    <td>
                        <input type="text" id="birth" placeholder="예) 850124">
                        <small>(숫자만 입력)</small>
                    </td>
                </tr>
                <tr>
                    <th>휴대폰</th>
                    <td>
                        <div class="input-group">
                            <input type="text" id="phone" placeholder="예) 01054321234">
                            <button type="button" onclick="sendSms()" class="btn-blue">인증번호발송</button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>인증번호</th>
                    <td>
                        <div class="input-group">
                            <input type="text" id="authCode" placeholder="인증번호 입력">
                            <span id="timer" class="timer"></span>
                            <button type="button" onclick="verifyCode()" class="btn-blue">인증확인</button>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <a href = "admin_main.html">관리자 페이지 접속하기</a>
    <script src="script.js"></script>
</body>
</html>
