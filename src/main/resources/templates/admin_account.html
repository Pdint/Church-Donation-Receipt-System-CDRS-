<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 계정 설정</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .settings-container { background-color: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; border-top: 5px solid #e74c3c; }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: #7f8c8d; font-size: 0.95rem; text-align: center; margin-bottom: 25px; }

        /* 에러 메시지 팝업 */
        .error-msg { background-color: #fde8e8; color: #e74c3c; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; font-weight: bold; border-left: 4px solid #e74c3c; text-align: center; }
        .warning-msg { background-color: #fef9e7; color: #d35400; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; text-align: center; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .input-group input:focus { border-color: #e74c3c; outline: none; }

        .btn-save { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-save:hover { opacity: 0.95; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #95a5a6; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #34495e; text-decoration: underline; }
    </style>
</head>
<body>

<div class="settings-container">
    <h2>🔐 관리자 계정 변경</h2>
    <p class="subtitle">시스템 접근 아이디와 비밀번호를 변경합니다.</p>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <div class="warning-msg">
        ⚠️ <b>안내:</b> 정보 변경 시 보안을 위해 자동으로 로그아웃됩니다. 새 정보로 다시 로그인해 주세요.
    </div>

    <form action="/admin/account" method="post">

        <div class="input-group">
            <label for="currentPassword">현재 비밀번호 (본인 확인용)</label>
            <input type="password" id="currentPassword" name="currentPassword" placeholder="현재 사용 중인 비밀번호 입력" required autofocus>
        </div>
        <hr style="border: 0; border-top: 1px dashed #ddd; margin: 25px 0;">

        <div class="input-group">
            <label for="newUsername">새로 사용할 아이디</label>
            <input type="text" id="newUsername" name="newUsername" th:value="${admin.username}" required>
        </div>

        <div class="input-group">
            <label for="newPassword">새로 사용할 비밀번호</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호 입력" required>
        </div>

        <button type="submit" class="btn-save">변경 후 다시 로그인하기</button>
    </form>

    <a href="/admin_main.html" class="back-link">⬅️ 취소하고 대시보드로 돌아가기</a>
</div>

</body>
</html>
