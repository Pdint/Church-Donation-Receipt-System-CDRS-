<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CDRS - 기부 내역 일괄 입력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; }

        /* 👈 상단 헤더 영역을 가로로 배치하기 위한 Flexbox 스타일 추가 */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-container h2 { margin: 0; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        input { width: 90%; padding: 5px; border: 1px solid #ccc; }

        .header-panel { margin-bottom: 20px; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 8px 15px; cursor: pointer; border-radius: 3px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="header-container">
    <h2>⛪ 기부 정산 내역 일괄 입력</h2>
</div>

<div class="header-panel">
    <strong>📅 정산(기부) 날짜 선택:</strong>
    <label for="settlementDate"></label><input type="date" id="settlementDate" style="width: 200px;">
    <p style="font-size: 0.85em; color: #666; margin-top: 5px;">
        * 선택한 날짜가 아래 모든 내역에 공통으로 적용됩니다.
    </p>
</div>

<div class="btn-group">
    <button onclick="addRow()">➕ 행 추가</button>
    <button onclick="submitDonations()" style="background-color: #4CAF50; color: white; border: none;">💾 전체 저장</button>
</div>

<table id="donationTable">
    <thead>
    <tr>
        <th>교인 선택</th>
        <th>헌금 종류</th> <th>기부 금액</th>
    </tr>
    </thead>
    <tbody id="donationBody">
    <tr>
        <td>
            <label>
                <select class="memberIdSelect" style="width: 100%; padding: 5px;">
                    <option value="">-- 로딩 중... --</option>
                </select>
            </label>
        </td>
        <td>
            <label>
                <select class="donationTypeSelect" style="width: 100%; padding: 5px;">
                    <option value="">-- 로딩 중... --</option>
                </select>
            </label>
        </td>
        <td><label><input type="number" class="amount" placeholder="금액"></label></td>
    </tr>
    </tbody>
</table>

<script>
    // 💡 서버에서 받아온 데이터를 저장해둘 전역 변수
    let membersData = [];
    let categoriesData = [];

    // 1. 페이지가 로드되자마자 실행되는 함수
    window.onload = async function() {
        try {
            // 🚨 [핵심 수정] 주소 끝에 반드시 /all 이 붙어있어야 합니다!
            const memberRes = await fetch('/api/admin/members/all');
            const categoryRes = await fetch('/api/categories/all');

            if (memberRes.ok) {
                membersData = await memberRes.json();
            } else {
                console.error("교인 목록을 불러오지 못했습니다.");
            }

            if (categoryRes.ok) {
                categoriesData = await categoryRes.json();
            } else {
                console.error("헌금 종류를 불러오지 못했습니다.");
            }

            // 2. 데이터를 무사히 가져왔다면, 화면에 있는 첫 번째 드롭다운에 데이터를 채워줍니다.
            const firstRow = document.querySelector('#donationBody tr');
            if (firstRow) {
                populateDropdowns(firstRow);
            }

        } catch (error) {
            console.error("데이터 통신 중 에러 발생:", error);
        }
    };

    // 3. 특정 줄(tr)의 드롭다운을 실제 데이터로 채워주는 마법의 함수
    function populateDropdowns(row) {
        const memberSelect = row.querySelector('.memberIdSelect');
        const typeSelect = row.querySelector('.donationTypeSelect');

        // 교인 목록 드롭다운 채우기
        memberSelect.innerHTML = '<option value="">-- 교인 선택 --</option>';
        membersData.forEach(m => {
            // value에는 ID(M9999)를 넣고, 화면에는 이름과 ID를 같이 보여줍니다.
            memberSelect.innerHTML += `<option value="${m.memberId}">${m.name} (${m.memberId})</option>`;
        });

        // 헌금 종류 드롭다운 채우기
        typeSelect.innerHTML = '<option value="">-- 헌금 종류 --</option>';
        categoriesData.forEach(c => {
            // value와 화면 모두 헌금 이름(십일조, 감사헌금 등)을 넣습니다.
            typeSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
        });
    }

    // 4. [ + 내역 추가 ] 버튼을 누를 때마다 새로운 줄을 만드는 함수
    function addRow() {
        const tbody = document.getElementById('donationBody');
        const newRow = document.createElement('tr');

        newRow.innerHTML = `
            <td>
                <select class="memberIdSelect" style="width: 100%; padding: 5px;">
                    <option value="">로딩중...</option>
                </select>
            </td>
            <td>
                <select class="donationTypeSelect" style="width: 100%; padding: 5px;">
                    <option value="">로딩중...</option>
                </select>
            </td>
            <td><input type="number" class="amount" placeholder="예: 50000" min="0"></td>
            <td>
                <button type="button" onclick="removeRow(this)" style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">삭제</button>
            </td>
        `;

        tbody.appendChild(newRow);

        // 💡 [중요] 새로 추가된 줄에도 교인과 헌금 종류 데이터를 꽉꽉 채워줍니다!
        populateDropdowns(newRow);
    }

    // 5. [ 삭제 ] 버튼을 누르면 해당 줄을 지우는 함수
    function removeRow(button) {
        const row = button.closest('tr');
        row.remove();
    }

    // 6. [ 서버로 저장 ] 기존에 있던 submitDonations 함수 (이름이 같다면 그대로 유지)
    async function submitDonations() {
        const dateInput = document.getElementById('settlementDate').value;
        if (!dateInput) {
            alert('정산(기부) 날짜를 먼저 선택해주세요!');
            return;
        }

        const rows = document.querySelectorAll('#donationBody tr');
        const data = Array.from(rows).map(row => ({
            memberId: row.querySelector('.memberIdSelect').value,
            donationType: row.querySelector('.donationTypeSelect').value,
            amount: parseInt(row.querySelector('.amount').value),
            donationDate: dateInput
        }));

        for (let req of data) {
            if (!req.memberId || !req.donationType || isNaN(req.amount)) {
                alert('교인, 헌금 종류, 금액을 모두 정확히 선택/입력해주세요.');
                return;
            }
        }

        try {
            const response = await fetch('/api/donations/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('모든 헌금 내역이 성공적으로 저장되었습니다!');
                location.reload();
            } else {
                const errorText = await response.text();
                alert('저장 실패: ' + errorText);
            }
        } catch (error) {
            console.error(error);
        }
    }
</script>
</body>
</html>
