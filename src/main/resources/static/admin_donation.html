<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CDRS - 기부 내역 일괄 입력</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; }

        /* 👈 상단 헤더 영역을 가로로 배치하기 위한 Flexbox 스타일 추가 */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-container h2 { margin: 0; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        input { width: 90%; padding: 5px; border: 1px solid #ccc; }

        .header-panel { margin-bottom: 20px; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 8px 15px; cursor: pointer; border-radius: 3px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="header-container">
    <h2>⛪ 기부 정산 내역 일괄 입력</h2>
</div>

<div class="header-panel">
    <strong>📅 정산(기부) 날짜 선택:</strong>
    <label for="settlementDate"></label><input type="date" id="settlementDate" style="width: 200px;">
    <p style="font-size: 0.85em; color: #666; margin-top: 5px;">
        * 선택한 날짜가 아래 모든 내역에 공통으로 적용됩니다.
    </p>
</div>

<div class="btn-group">
    <button onclick="addRow()">➕ 행 추가</button>
    <button onclick="submitDonations()" style="background-color: #4CAF50; color: white; border: none;">💾 전체 저장</button>
</div>

<table id="donationTable">
    <thead>
    <tr>
        <th>교인 선택</th>
        <th>헌금 종류</th> <th>기부 금액</th>
    </tr>
    </thead>
    <tbody id="donationBody">
    <tr>
        <td>
            <label>
                <select class="memberIdSelect" style="width: 100%; padding: 5px;">
                    <option value="">-- 로딩 중... --</option>
                </select>
            </label>
        </td>
        <td>
            <label>
                <select class="donationTypeSelect" style="width: 100%; padding: 5px;">
                    <option value="">-- 로딩 중... --</option>
                </select>
            </label>
        </td>
        <td><label><input type="number" class="amount" placeholder="금액"></label></td>
    </tr>
    </tbody>
</table>

<script>
    let memberOptionsHTML = '<option value="">-- 교인을 선택하세요 --</option>';
    let categoryOptionsHTML = '<option value="">-- 헌금 종류 --</option>'; // 👈 카테고리 HTML 변수 추가

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // 1. 교인 목록 불러오기
            const memberRes = await fetch('/api/members/all');
            const members = await memberRes.json();
            members.forEach(m => {
                memberOptionsHTML += `<option value="${m.memberId}">${m.name} (${m.birthDate})</option>`;
            });

            // 2. 헌금 종류 불러오기 👈 추가됨!
            const categoryRes = await fetch('/api/categories/all');
            const categories = await categoryRes.json();
            categories.forEach(c => {
                categoryOptionsHTML += `<option value="${c.name}">${c.name}</option>`; // 값으로 헌금 이름(String)을 씁니다.
            });

            // 첫 번째 콤보박스들에 데이터 삽입
            document.querySelector('.memberIdSelect').innerHTML = memberOptionsHTML;
            document.querySelector('.donationTypeSelect').innerHTML = categoryOptionsHTML;

        } catch (e) {
            console.error('데이터를 불러오는데 실패했습니다.', e);
        }
    });

    // 행 추가 시 교인 목록과 헌금 종류 목록 모두 복사
    function addRow() {
        const tbody = document.getElementById('donationBody');
        const newRow = document.createElement('tr');

        newRow.innerHTML = `
            <td>
                <select class="memberIdSelect" style="width: 100%; padding: 5px;">
                    ${memberOptionsHTML}
                </select>
            </td>
            <td>
                <select class="donationTypeSelect" style="width: 100%; padding: 5px;">
                    ${categoryOptionsHTML}
                </select>
            </td>
            <td><input type="number" class="amount" placeholder="금액"></td>
        `;
        tbody.appendChild(newRow);
    }

    // 서버로 전송
    async function submitDonations() {
        const dateInput = document.getElementById('settlementDate').value;
        if (!dateInput) {
            alert('정산(기부) 날짜를 먼저 선택해주세요!');
            return;
        }

        const rows = document.querySelectorAll('#donationBody tr');

        // 👈 donationType 데이터 수집 추가
        const data = Array.from(rows).map(row => ({
            memberId: row.querySelector('.memberIdSelect').value,
            donationType: row.querySelector('.donationTypeSelect').value,
            amount: parseInt(row.querySelector('.amount').value),
            donationDate: dateInput
        }));

        for (let req of data) {
            if (!req.memberId || !req.donationType || isNaN(req.amount)) {
                alert('교인, 헌금 종류, 금액을 모두 정확히 입력해주세요.');
                return;
            }
        }

        try {
            const response = await fetch('/api/donations/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('모든 내역이 성공적으로 저장되었습니다!');
                location.reload();
            } else {
                const errorText = await response.text();
                alert('저장 실패: ' + errorText);
            }
        } catch (error) {
            alert('서버 통신 오류가 발생했습니다.');
            console.error(error);
        }
    }
</script>
</body>
</html>
