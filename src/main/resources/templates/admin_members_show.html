<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>교인 명부 관리</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #f4f6f8; font-weight: bold; }
        .btn-excel {
            background-color: #1D6F42; /* 엑셀의 상징 초록색! */
            color: white; padding: 10px 15px;
            text-decoration: none; border-radius: 5px; font-weight: bold;
        }
        .btn-excel:hover { background-color: #144c2d; }
    </style>
</head>
<body>
<h2>📋 전체 교인 명부</h2>

<a href="/admin/members/excel" class="btn-excel">💾 엑셀로 다운로드</a>

<table>
    <thead>
    <tr>
        <th>교인 ID</th>
        <th>이름</th>
        <th>생년월일</th>
        <th>전화번호</th>
        <th>작성일자</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${members}">
        <td th:text="${member.memberId}"></td>
        <td th:text="${member.name}"></td>
        <td th:text="${member.birthDate}"></td>
        <td th:text="${member.phone}"></td>
        <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td>
            <button th:onclick="|openEditModal('${member.memberId}', '${member.name}', '${member.birthDate}', '${member.phone}')|">
                수정
            </button>
            <form th:action="@{/admin/members/delete/{id}(id=${member.memberId})}" method="post" style="display:inline;">
                <button type="submit"
                        onclick="return confirm('🚨 경고: 이 교인을 삭제하면 관련된 [모든 헌금 내역]도 함께 영구 삭제됩니다. 정말 지우시겠습니까?');"
                        style="background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    교인 삭제
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 300px;">
        <h3 style="margin-top: 0;">교인 정보 수정</h3>

        <input type="hidden" id="editMemberId">

        <div style="margin-bottom: 15px;">
            <label>이름</label><br>
            <input type="text" id="editName" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>생년월일 (YYYY-MM-DD)</label><br>
            <input type="text" id="editBirth" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label>전화번호</label><br>
            <input type="text" id="editPhone" style="width: 90%; padding: 8px;">
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="closeEditModal()" style="padding: 8px 15px; border: none; background: #95a5a6; color: white; border-radius: 4px; cursor: pointer;">취소</button>
            <button onclick="submitEdit()" style="padding: 8px 15px; border: none; background: #3498db; color: white; border-radius: 4px; cursor: pointer;">저장</button>
        </div>
    </div>
</div>

<script>
    // 1. 모달 열기 (기존 목록의 '수정' 버튼에서 이 함수를 호출하게 만드세요!)
    // 사용 예시: <button onclick="openEditModal('M9999', '홍길동', '1990-01-01', '01012345678')">수정</button>
    function openEditModal(id, name, birth, phone) {
        document.getElementById('editMemberId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editBirth').value = birth;
        document.getElementById('editPhone').value = phone;

        document.getElementById('editModal').style.display = 'flex';
    }

    // 2. 모달 닫기
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // 3. 수정한 데이터 백엔드로 전송 (PUT 요청)
    async function submitEdit() {
        const id = document.getElementById('editMemberId').value;
        const name = document.getElementById('editName').value;
        const birth = document.getElementById('editBirth').value;
        const phone = document.getElementById('editPhone').value;

        if (!name || !birth || !phone) {
            alert("모든 정보를 입력해주세요.");
            return;
        }

        try {
            const response = await fetch(`/api/admin/members/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    birthDate: birth,
                    phone: phone
                })
            });

            if (response.ok) {
                alert("교인 정보가 성공적으로 수정되었습니다.");
                closeEditModal();
                // 💡 수정 완료 후, 화면을 새로고침하여 변경된 리스트를 보여줍니다.
                window.location.reload();
            } else {
                const errorMsg = await response.text();
                alert("수정 실패: " + errorMsg);
            }
        } catch (error) {
            console.error(error);
            alert("서버 통신 중 에러가 발생했습니다.");
        }
    }
</script>
</body>
</html>
