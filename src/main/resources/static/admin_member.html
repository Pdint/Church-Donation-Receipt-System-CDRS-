<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CDRS - 교인 마스터 등록</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; }
        input { padding: 5px; width: 250px; }
        button { padding: 10px 20px; background-color: #2196F3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h2>👥 신규 교인 마스터 등록</h2>
<div class="form-group">
    <label>교인 ID:</label>
    <input type="text" id="memberId" placeholder="예: 2023001">
</div>
<div class="form-group">
    <label>성함:</label>
    <input type="text" id="name">
</div>
<div class="form-group">
    <label>생년월일:</label>
    <input type="text" id="birthDate" placeholder="6자리 (예: 040512)">
</div>
<div class="form-group">
    <label>전화번호:</label>
    <input type="text" id="phone" placeholder="010-0000-0000">
</div>
<button onclick="saveMember()">교인 등록</button>

<script>
    async function saveMember() {
        // 1. 입력값 가져오기 (trim()을 써서 띄어쓰기만 입력한 것도 걸러냅니다)
        const memberId = document.getElementById('memberId').value.trim();
        const name = document.getElementById('name').value.trim();
        const birthDate = document.getElementById('birthDate').value.trim();
        const rawPhone = document.getElementById('phone').value.trim();

        // 🚨 [예외 처리] 프론트엔드 빈 값 체크
        if (!memberId || !name || !birthDate || !rawPhone) {
            alert('⚠️ 모든 항목을 빈칸 없이 기입해 주세요.');
            return; // 여기서 함수를 종료하여 서버로 넘어가지 않게 막음!
        }

        const cleanPhone = rawPhone.replace(/-/g, '');

        const data = {
            memberId: memberId,
            name: name,
            birthDate: birthDate,
            phone: cleanPhone
        };

        const response = await fetch('/api/member', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('교인 정보가 등록되었습니다.');
            location.reload();
        } else {
            // 서버에서 에러(400 Bad Request 등)가 넘어왔을 때의 처리
            const errorMsg = await response.text();
            alert('등록 실패: ' + errorMsg);
        }
    }
</script>
</body>
</html>
