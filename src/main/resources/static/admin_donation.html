<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CDRS - 기부 내역 일괄 입력</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        input { width: 90%; padding: 5px; border: 1px solid #ccc; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
<h2>⛪ 기부 정산 내역 일괄 입력</h2>

<div class="header-panel">
    <strong>📅 정산(기부) 날짜 선택:</strong>
    <input type="date" id="settlementDate" style="width: 200px;">
    <p style="font-size: 0.85em; color: #666; margin-top: 5px;">
        * 선택한 날짜가 아래 모든 내역에 공통으로 적용됩니다.
    </p>
</div>

<div class="btn-group">
    <button onclick="addRow()">➕ 행 추가</button>
    <button onclick="submitDonations()" style="background-color: #4CAF50; color: white;">💾 전체 저장</button>
</div>

<!-- 핵심 변경 부분만 기재 -->
<table id="donationTable">
    <thead>
    <tr>
        <th>교인 ID</th>
        <th>기부 금액</th>
    </tr>
    </thead>
    <tbody id="donationBody">
    <tr>
        <td><input type="text" class="memberId" placeholder="ID 입력"></td>
        <td><input type="number" class="amount" placeholder="금액"></td>
    </tr>
    </tbody>
</table>

<script>
    function addRow() {
        const tbody = document.getElementById('donationBody');
        const newRow = tbody.rows[0].cloneNode(true);
        // 입력값 초기화
        const inputs = newRow.getElementsByTagName('input');
        for(let i=0; i<inputs.length-1; i++) inputs[i].value = '';
        tbody.appendChild(newRow);
    }

    async function submitDonations() {
        const rows = document.querySelectorAll('#donationBody tr');
        const data = Array.from(rows).map(row => ({
            name: row.querySelector('.name').value,
            memberId: row.querySelector('.memberId').value,
            amount: parseInt(row.querySelector('.amount').value),
            phone: row.querySelector('.phone').value,
            birthDate: row.querySelector('.birthDate').value,
        }));

        const response = await fetch('/api/donation/batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('모든 내역이 성공적으로 저장되었습니다!');
            location.reload();
        } else {
            alert('저장에 실패했습니다. 데이터를 확인해주세요.');
        }
    }
</script>
</body>
</html>
