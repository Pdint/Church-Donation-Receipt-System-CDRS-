<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CDRS - 재정 통계 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .chart-wrapper { position: relative; height: 50vh; width: 100%; }
        .controls { text-align: center; margin-bottom: 20px; }
        select { padding: 8px 15px; font-size: 16px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 교회 재정 통계 대시보드</h2>

    <div class="controls">
        <label><strong>조회 연도:</strong> </label>
        <select id="yearSelect" onchange="loadChartData()">
            <option value="2025">2025년</option>
            <option value="2026" selected>2026년</option> <option value="2027">2027년</option>
        </select>
    </div>

    <div class="chart-wrapper">
        <canvas id="monthlyChart"></canvas>
    </div>
</div>

<script>
    let myChart = null; // 차트 객체 초기화

    // 1. 페이지가 열리면 즉시 데이터 로드
    window.onload = function() {
        loadChartData();
    };

    // 2. 백엔드에서 통계 데이터를 가져와 차트를 그리는 함수
    async function loadChartData() {
        const year = document.getElementById('yearSelect').value;

        try {
            // 방금 만든 백엔드 API 호출!
            const response = await fetch(`/api/dashboard/monthly?year=${year}`);
            const data = await response.json(); // [{month: 1, total: 150000}, {month: 5, total: 200000}] 형태

            // 서버가 도대체 뭘 보냈는지 F12(콘솔) 창에 출력해보기!
            console.log("백엔드 응답 데이터:", data);

            // 데이터가 배열(Array)이 아니면 차트 안 그리고 에러 메시지 띄우기!
            if (!Array.isArray(data)) {
                alert("서버에서 정상적인 리스트를 받지 못했습니다. 백엔드 에러를 확인하세요.");
                return;
            }

            // 차트용 데이터 배열로 가공
            const labels = [];
            const amounts = [];

            // 1월부터 12월까지 기본값 0으로 세팅 (데이터가 없는 달 처리)
            for (let i = 1; i <= 12; i++) {
                labels.push(i + '월');
                // DB에서 가져온 데이터 중 해당 월(i)이 있는지 찾기
                const monthData = data.find(item => item.month === i);
                amounts.push(monthData ? monthData.total : 0);
            }

            renderChart(labels, amounts, year);

        } catch (error) {
            console.error("통계 데이터를 불러오는 중 오류 발생:", error);
        }
    }

    // 3. Chart.js를 이용해 막대그래프 그리기
    function renderChart(labels, data, year) {
        const ctx = document.getElementById('monthlyChart').getContext('2d');

        // 기존 차트가 있으면 지우고 새로 그리기 (연도 변경 시 겹침 방지)
        if (myChart != null) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'bar', // 막대그래프
            data: {
                labels: labels, // X축: 1월~12월
                datasets: [{
                    label: `${year}년 월별 헌금 총액 (원)`,
                    data: data, // Y축: 금액
                    backgroundColor: 'rgba(54, 162, 235, 0.6)', // 차트 색상 (파란색)
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            // 금액에 콤마(,) 찍어주기
                            callback: function(value) {
                                return value.toLocaleString() + ' 원';
                            }
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
