<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDRS 관리자 로그인</title>
    <style>
        /* 외부 CSS 파일을 안 거치고 직접 고정해서 절대 깨지지 않는 무적의 스타일 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #74abe2 0%, #5563c1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #5563c1;
            outline: none;
        }
        .btn-login {
            background: linear-gradient(135deg, #5563c1 0%, #34495e 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(85, 99, 193, 0.3);
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .error-msg {
            background-color: #fde8e8;
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-left: 4px solid #e74c3c;
        }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #5563c1;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>🔒 CDRS 관리자 시스템</h2>
    <p class="subtitle">서비스 관리를 위해 로그인이 필요합니다.</p>

    <div th:if="${param.error}" class="error-msg">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <label for="username">관리자 아이디</label>
            <input type="text" id="username" name="username" placeholder="(초기 아이디: admin)" required autofocus>
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="(초기 비밀번호: admin1234!)" required>
        </div>
        <button type="submit" class="btn-login">로그인</button>
    </form>

    <a href="/CDRS.html" class="back-link">⬅️ 교인 화면(메인)으로 돌아가기</a>
</div>

</body>
</html>
