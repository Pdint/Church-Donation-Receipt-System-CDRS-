spring.application.name=CDRS
# MySQL 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 주소:, 3306(포트), cdrs(생성한 스키마 이름)
spring.datasource.url=jdbc:mysql://cdrs-mysql:3306/cdrs?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword

# JPA 상세 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 사용할 아이디를 적어주세요.
init.admin.username=admin

# 사용할 비밀번호를 적어주세요. (영문, 숫자, 특수문자 조합 추천)
init.admin.password=admin1234!