spring.application.name=CDRS
# MySQL 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 주소: localhost(내컴퓨터), 3306(포트), cdrs(생성한 스키마 이름)
spring.datasource.url=jdbc:mysql://localhost:3306/cdrs?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

# JPA 상세 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#api 키 secrets 으로 숨겨둠...
spring.profiles.include=secrets